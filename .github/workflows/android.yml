name: android

# Builds the Android receiver (apps/scanner) on CI.
#
# Why CI: the APK needs three toolchains that are easy to get wrong locally —
# a pinned NDK (27.0.12077973), CMake 3.22.1 for the ZXing-C++ JNI bridge, and a
# Rust `aarch64-linux-android` toolchain plus cargo-ndk for `libtransfer_engine.so`.
# Gradle's `compileRustJni` task invokes `cargo ndk`, so a runner without Rust
# cannot produce an APK at all (see AGENTS.md §2.3).
#
# Only the **debug** variant is built here. `app/build.gradle.kts` has a task-graph
# guard that fails any release build without `apps/scanner/keystore.properties`,
# which is git-ignored and never present on CI. Debug signing is enough to
# sideload and verify the camera behavior on a real device.

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'apps/scanner/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'apps/scanner/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # ---- Toolchains -------------------------------------------------------
      # JDK 17: required by AGP 8.5.2 and the module's `jvmTarget = 17`.
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache cargo registry + target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-android-jni-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-android-jni-

      # The ubuntu runner image already ships a provisioned Android SDK, so no
      # setup-android action is needed — and it must NOT be used: v3 runs
      # `sdkmanager tools`, a package current cmdline-tools (16.0+) no longer
      # publishes, so it fails with "Failed to find package 'tools'" before any
      # project step runs.
      #
      # The NDK version is pinned to exactly what `app/build.gradle.kts`
      # (`ndkVersion`) and CMake require. AGP does not substitute a different
      # installed NDK, so a mismatch fails the build at the native step.
      - name: Install NDK 27.0.12077973 + CMake 3.22.1
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/scanner/**/*.gradle*', 'apps/scanner/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ---- Tests (pure JVM, no device / native libs) ------------------------
      # Covers the shutter-speed model: preset/label consistency, capability
      # filtering and the auto-ISO controller. These are the parts of the
      # fixed-shutter feature that cannot be exercised without hardware.
      - name: Unit tests
        working-directory: apps/scanner
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # ---- Build ------------------------------------------------------------
      # `mergeDebugJniLibFolders` depends on `compileRustJni`, which runs
      # `cargo ndk ... build -p transfer-engine --features jni --release` into
      # app/src/main/jniLibs/arm64-v8a. That is why Rust + cargo-ndk are
      # installed above; without them this step fails outright.
      - name: Assemble debug APK
        working-directory: apps/scanner
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airferry-receiver-android-debug
          path: apps/scanner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
